apiVersion: v1
kind: Service
metadata:
  name: flux-gateway-svc
  namespace: flux-prod
  labels:
    app.kubernetes.io/name: flux
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 8080
  selector:
    app.kubernetes.io/name: flux
    app.kubernetes.io/component: control-plane
