version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flux-postgres-rls
    environment:
      POSTGRES_DB: flux_prod
      POSTGRES_USER: flux_admin
      POSTGRES_PASSWORD: flux_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - ./saas-control/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux_admin -d flux_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  flux-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux-saas-gateway
    environment:
      PORT: "8080"
      FLUX_ENV: "production"
      DATABASE_URL: "postgresql://flux_admin:flux_secure_password_2026@postgres:5432/flux_prod"
      FLUX_JWT_SECRET: "flux-enterprise-secret-key-2026-sha256"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: flux-prometheus
    volumes:
      - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - flux-gateway
