name: Flux Institutional CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-pricing-kernel:
    name: C++20 Pricing Kernels & AVX-512 Hot Path
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Clang & Build Tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake

      - name: Compile and Run C++ Unit Tests
        run: |
          cd core-engine
          clang++ -std=c++20 -O3 -Wall -Wextra -Werror -Iinclude tests/test_pricing.cpp -o run_tests
          ./run_tests

      - name: Compile and Run Mathematical Reference Validation (Monte Carlo Tolerance)
        run: |
          cd core-engine
          clang++ -std=c++20 -O3 -Iinclude tests/test_reference_validation.cpp -o test_reference_validation
          ./test_reference_validation

      - name: Compile and Run Advanced Quant Depth (SABR, 3:2:1 Crack, Cholesky MC)
        run: |
          cd core-engine
          clang++ -std=c++20 -O3 -Iinclude tests/test_quant_depth.cpp -o test_quant_depth
          ./test_quant_depth

      - name: Execute 1,000,000-Run Scale Benchmark
        run: |
          cd core-engine
          clang++ -std=c++20 -O3 -Iinclude tests/benchmark_scale.cpp -o benchmark_scale
          ./benchmark_scale

  rust-core-engine:
    name: Rust Lock-Free SMM & Aeron Raft Sequencer
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Test
        run: |
          cd core-engine
          cargo test --verbose

      - name: Execute Rust Release Scale Benchmark
        run: |
          cd core-engine
          cargo run --release

  go-saas-control:
    name: Go 16-Way Sharded SaaS Gateway & CLI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit & 50k Concurrent Load Tests
        run: |
          cd saas-control
          go test -v .

      - name: Compile Flux Terminal CLI Binary
        run: |
          go build -o bin/flux cli/*.go
          ./bin/flux about
          ./bin/flux benchmark

  python-multi-agent-ai:
    name: Python Multi-Agent AI Subsystem
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Test Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest

      - name: Run Multi-Agent AI Pytest Suite
        run: |
          python3 -m pytest agents/tests/test_agents.py
